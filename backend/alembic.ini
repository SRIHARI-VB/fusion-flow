[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
# NOTE: sqlalchemy.url is intentionally left blank. alembic/env.py injects
# DATABASE_URL from fusionflow.config.Settings so migrations and the app can
# never drift onto different databases, and so no credentials live in this
# file.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
