[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusionflow"
version = "0.1.0"
description = "fusion-flow backend service (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "cryptography>=42.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
# Provision-but-skip-in-dev: these are only imported inside the
# corresponding backend class (RedisCacheBackend / CeleryQueue), never at
# module import time, so the app boots fine without them installed.
redis = ["redis>=5.0"]
celery = ["celery>=5.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # httpx is already a runtime dependency; it doubles as the ASGI test
    # client (httpx.ASGITransport) so no separate test client is needed.
]

[tool.hatch.build.targets.wheel]
packages = ["src/fusionflow"]

[tool.vercel]
entrypoint = "src.fusionflow.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "needs_postgres: requires a live Postgres via $TEST_DATABASE_URL with migrations applied",
]
